# nginx 站点配置 — 部署到 /etc/nginx/sites-enabled/xhs-collect
# 对外暴露 8866 端口（HTTP），反向代理到 127.0.0.1:8765 的 uvicorn 服务

server {
    listen 8866;
    server_name 14.22.112.147;

    # 允许浏览器扩展跨域调用（server 级，自动应用到所有响应包括 OPTIONS 204）
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'X-Auth-Token, Content-Type, Authorization' always;
    add_header 'Access-Control-Max-Age' '1728000' always;

    location / {
        # 预检请求直接 204（nginx 不允许 if 内 add_header，但 return 是允许的）
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 5m;
    }

    # 健康检查端口（不打日志）
    location = /api/health {
        proxy_pass http://127.0.0.1:8765;
        access_log off;
    }
}
